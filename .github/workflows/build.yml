name: Dong goi app

on: workflow_dispatch

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien
        run: python -m pip install playwright streamlit pyinstaller

      - name: Dong goi (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm --clean --noconsole --name "Douyin Downloader" --collect-all streamlit --copy-metadata streamlit --collect-all playwright --hidden-import browser_worker --hidden-import downloader --hidden-import watcher --hidden-import notifier --add-data "app.py;." --add-data "downloader.py;." --add-data "watcher.py;." --add-data "notifier.py;." --add-data "browser_worker.py;." launcher.py

      - name: Dong goi (Mac)
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Douyin Downloader" --collect-all streamlit --copy-metadata streamlit --collect-all playwright --hidden-import browser_worker --hidden-import downloader --hidden-import watcher --hidden-import notifier --add-data "app.py:." --add-data "downloader.py:." --add-data "watcher.py:." --add-data "notifier.py:." --add-data "browser_worker.py:." launcher.py
          cd dist && ditto -c -k --keepParent "Douyin Downloader.app" DouyinDownloader-Mac.zip

      - name: Luu ban Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-Windows
          path: dist/Douyin Downloader

      - name: Luu ban Mac
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-Mac
          path: dist/DouyinDownloader-Mac.zip
